    <h1>Case #04 THE MISSING SERVICE</h1>
    <div class="question">
        <p>You paid for an online service, but the service was not provided as promised. What should you do first?</p>
    </div>
    <div class="clues1">
        <p>Payment</p>
    </div>
    <div class="clues2">
        <p>Receipt</p>
    </div>
    <div class="clues3">
        <p>Service</p>
    </div>
    <div class="option">
        <p>What do you think is the correct answer?</p>
    </div>
    <!-- <img src="Password.png" alt="'Password" width=280> -->
    <div class="options">
    <button class="A">Share your card PIN with the provider</button>
    <button class="A" type="button" onclick="alert('  Keep transaction records and communications, contact the provider, and if unresolved consider the appropriate consumer grievance route.')">Collect the payment receipt and service communications and contact the provider</button>
    <button class="A"> Destroy the transaction record</button>
    <button class="A">Do nothing because online purchases have no consumer protection</button>
