    <h1>Case #05 THE CONSUMER COMPLAINT</h1>
    <div class="question">
        <p>Which statement about filing a consumer complaint is correct under Section 35 of the Consumer Protection Act, 2019?</p>
    </div>
    <div class="clues1">
        <p>Consumer</p>
    </div>
    <div class="clues2">
        <p>Complaint</p>
    </div>
    <div class="clues3">
        <p>Commission</p>
    </div>
    <div class="option">
        <p>What do you think is the correct answer?</p>
    </div>
    <!-- <img src="Password.png" alt="'Password" width=280> -->
    <div class="options">
    <button class="A" type="button" onclick="alert('Section 35 sets out who may file a complaint before a District Commission and provides for electronic filing in the prescribed manner.')">A consumer may file a complaint before the District Commission in the manner provided by the Act</button>
    <button class="A">Only the seller can file a complaint</button>
    <button class="A">Consumer complaints can never be filed electronically</button>
    <button class="A">Only a lawyer can ever make a consumer complaint</button>
    </div>
