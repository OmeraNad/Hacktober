<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rights Investigation - Identity Verification</title>
    <style>
        /* Cleaned up font imports to guarantee proper font delivery */
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
            /* Luminous light cyber background gradient */
            background: radial-gradient(circle at center, #f0fdfa 0%, #e0f2fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a; /* Dark slate text for sharp readability */
            overflow-x: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 3rem 2.5rem;
            background: #ffffff; /* Brilliant white card asset */
            border: 3px solid #06b6d4; /* Vibrant electric cyan border frame */
            border-radius: 16px;
            box-shadow: 
                0 20px 40px -15px rgba(6, 182, 212, 0.25),
                0 10px 20px -10px rgba(15, 23, 42, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .security-badge {
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #0891b2; /* Cyan dark text */
            background: #ecfeff; /* Soft cyan background block */
            padding: 0.4rem 1rem;
            border-radius: 6px;
            border: 1px solid #cffafe;
            margin-bottom: 1.75rem;
        }

        h1 {
            font-family: 'Tektur', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            color: #06b6d4; /* Electric Cyan main title */
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Intense light glow effect */
            text-shadow: 0 2px 10px rgba(6, 182, 212, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #64748b; /* Medium grey subtitle */
            font-size: 1rem;
            margin-top: 0.35rem;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-family: 'Tektur', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #334155;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: #f8fafc; /* Crisp light input fields */
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            color: #0f172a;
            font-size: 1rem;
            font-family: 'Roboto', sans-serif;
            transition: all 0.2s ease-in-out;
        }

        /* Sharp focus glow ring on interaction */
        .input-group input:focus {
            outline: none;
            border-color: #06b6d4; /* Lights up cyan when active */
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.15);
            background: #ffffff;
        }

        .login-btn {
            font-family: 'Tektur', sans-serif;
            width: 100%;
            padding: 1rem;
            background: #06b6d4; /* Electric Cyan primary state */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1rem;
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
        }

        .login-btn:hover {
            background: #ef4444; /* High-energy Crimson red pop on hover */
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .login-btn:active {
            transform: translateY(1px);
        }

        /* Mobile Layout Scales */
        @media (max-width: 480px) {
            .login-container {
                padding: 2.5rem 1.5rem;
                margin: 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="security-badge">SECURE TERMINAL</div>
        
        <header>
            <h1>Access Portal</h1>
            <p class="subtitle">Verify your investigator credentials</p>
        </header>

        <form class="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter badge or username..." required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter secure key..." required>
            </div>

            <button type="submit" class="login-btn">Authenticate</button>
        </form>
    </div>

    <script>
        document.querySelector('.login-form').addEventListener('submit', function(e) {
            // 1. Prevent the local server from refreshing the page or causing a 405 error
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            if (!usernameInput) return;

            const previousName = (localStorage.getItem('currentPlayerName') || '').trim();
            const legacyProgress = localStorage.getItem('lawlinkQuizProgress');
            if (legacyProgress) {
                const legacyOwner = (previousName || usernameInput).toLocaleLowerCase();
                const legacyKey = `lawlinkQuizProgress:${encodeURIComponent(legacyOwner)}`;
                if (!localStorage.getItem(legacyKey)) localStorage.setItem(legacyKey, legacyProgress);
                localStorage.removeItem('lawlinkQuizProgress');
            }

            localStorage.setItem('currentPlayerName', usernameInput);

            const playerId = usernameInput.toLocaleLowerCase();
            const progressKey = `lawlinkQuizProgress:${encodeURIComponent(playerId)}`;
            const progress = JSON.parse(localStorage.getItem(progressKey) || '{}');
            const score = Object.values(progress).reduce(
                (total, topic) => total + (Number(topic.score) || 0),
                0
            );
            let leaderboard = {};
            try {
                leaderboard = JSON.parse(localStorage.getItem('lawlinkLeaderboard')) || {};
            } catch {
                leaderboard = {};
            }
            leaderboard[playerId] = { name: usernameInput, score };
            localStorage.setItem('lawlinkLeaderboard', JSON.stringify(leaderboard));

            window.location.href = "categories.html"; 
        });
    </script>
</body>
</html>
