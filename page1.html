<body>
    
    <h1>Case #01 THE HACKED ACCOUNT</h1>
    <div class="question">
        <p>You receive a message saying you won a prize and it asks for your OTP and UPI PIN.</p>
    </div>
    <div class="clues1">
        <p>OTP</p>
    </div>
    <div class="clues2">
        <p>Secret</p>
    </div>
    <div class="clues3">
        <p>Don't Share</p>
    </div>
    <div class="option">
        <p> What is the safest response?</p>
    </div>
    <!-- <img src="Password.png" alt="'Password" width=280> -->
    <div class="options">
    <button class="A">Share the OTP but not the PIN</button>
    <button class="A">Share it only if the message looks official</button>
    <button class="A" type="button" onclick="alert(' Never share an OTP, UPI PIN, password, or similar authentication secret with an unknown person or suspicious link. Verify through the official app or website')">Do not share either and verify through the official service</button>
    <button class="A">Forward the message to friends first</button>
    </div>
