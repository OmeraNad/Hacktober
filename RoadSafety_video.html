.ov{position:absolute;left:0;right:0;text-align:center;pointer-events:none}

#end{inset:0;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);display:flex;flex-direction:column;align-items:center;justify-content:center}

.quiz-btn {
    position: fixed;
    right: 30px;
    bottom: 30px;

    padding: 14px 30px;

    background: #2563EB;
    color: white;

    border: 2px solid #1E1B48;
    border-radius: 12px;

    font-size: 1.2rem;
    font-weight: bold;

    box-shadow: 0 5px 15px rgba(34, 211, 238, 0.5);

    cursor: pointer;

    transition: 0.2s ease;
}

.quiz-btn:hover {
    background: #3B82F6;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(34, 211, 238, 0.8);
}
